:root {
  --navy: #1F3A5F; --amber: #D99A1E; --amber-soft: #F6E7C4; --red: #C0392B; --red-soft: #FBE3DD; --ok: #2F7A5B; --ok-soft: #DFF1E8;
  --paper: #FFFDF8; --ink: #1B2430; --muted: #5B6575; --line: #E3DDCF; --card: #FFFFFF;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #141A23; --ink: #F1ECE0; --muted: #A8B0BD; --line: #2B3442; --card: #1C2430; --navy: #8FB3E0; --amber-soft: #3A2F18; --ok-soft: #173327; --red-soft: #3A1E18; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #141A23; --ink: #F1ECE0; --muted: #A8B0BD; --line: #2B3442; --card: #1C2430; --navy: #8FB3E0; --amber-soft: #3A2F18; --ok-soft: #173327; --red-soft: #3A1E18; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.han { font-family: "KaiEmbed", "KaiTi", "STKaiti", "Kaiti SC", serif; font-weight: normal; }
.py { font-family: "Times New Roman", Times, serif; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 16px 22px 36px; }
header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; border-bottom: 3px solid var(--amber); }
header h1 { margin: 0; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
header h1 .han { font-size: clamp(2.2rem, 3.6vw, 3.1rem); color: var(--navy); line-height: 1; }
header h1 small { color: var(--muted); font-size: 1.05rem; font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: .82rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.units { display: flex; flex-wrap: wrap; gap: 6px; }
.unit { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 700; }
.unit .han { font-size: 1.1rem; }
.unit[aria-pressed="true"] { background: #1F3A5F; border-color: #1F3A5F; color: #fff; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--card); padding: 9px 12px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: #1F3A5F; color: #fff; }
select { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 10px; font-weight: 600; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 14px; font-weight: 700; }
.btn-primary { background: #1F3A5F; border-color: #1F3A5F; color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }

.status { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 18px 0 12px; }
.progress { font-weight: 700; color: var(--muted); }
.teams { display: flex; gap: 10px; flex-wrap: wrap; }
.team { border: 3px solid var(--line); border-radius: 14px; padding: 8px 14px; min-width: 120px; background: var(--card); display: flex; align-items: center; gap: 10px; }
.team .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.team b { font-size: 1.6rem; margin-left: auto; }
.team.turn { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.team.turn::after { content: "turno"; font-size: .75rem; font-weight: 800; color: var(--c); text-transform: uppercase; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.card { aspect-ratio: 1 / 1.05; border-radius: 16px; border: 0; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: linear-gradient(160deg, #1F3A5F, #2C4F7C); color: #fff; box-shadow: 0 5px 0 #142740; transition: transform .15s; position: relative; }
.card:hover { transform: translateY(-3px); }
.card .n { font-size: 2.4rem; font-weight: 800; }
.card .seal { position: absolute; top: 8px; right: 10px; font-size: .9rem; opacity: .5; }
.card.done { background: var(--card); color: var(--ink); box-shadow: none; border: 3px solid var(--line); }
.card.done.ok { border-color: var(--ok); background: var(--ok-soft); }
.card.done.no { border-color: var(--red); background: var(--red-soft); }
.card.done .han { font-size: 1.9rem; line-height: 1.1; }
.card.done small { color: var(--muted); font-size: .8rem; text-align: center; }
.card.done .n { display: none; }

.overlay { position: fixed; inset: 0; background: rgba(15,22,33,.66); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.overlay.open { display: flex; }
.big { background: var(--card); color: var(--ink); width: min(900px, 100%); max-height: 100%; overflow: auto; border-radius: 26px; padding: 26px 28px 24px; text-align: center; position: relative; border-top: 10px solid var(--amber); }
.big .num { position: absolute; top: 14px; left: 20px; font-weight: 800; color: var(--muted); }
.big .close { position: absolute; top: 10px; right: 12px; }

  const msg = document.getElementById('dmsg'), a = document.getElementById('dactions');
  if (D.state === 'ask') { msg.textContent = D.locked[0] || D.locked[1] ? `Rebote: ¿lo sabe ${dname(D.locked[0] ? 1 : 0)}?` : '¿Quién lo sabe? ¡Pulsad vuestro botón!'; msg.style.color = ''; a.innerHTML = `<button class="btn" id="dsay">${SPEAK}Escuchar</button><button class="btn" id="dshow">Nadie lo sabe: ver la respuesta</button>`; }
  else if (D.state === 'answer') { msg.textContent = `Contesta ${dname(D.who)}`; msg.style.color = D.who ? '#1F5FAD' : '#C0392B'; a.innerHTML = `<button class="btn ok-btn" id="dok">✓ Correcto</button><button class="btn no-btn" id="dno">✗ Incorrecto</button>`; }
  else if (D.state === 'shown') { a.innerHTML = `<button class="btn listen" id="dsay">${SPEAK}Escuchar</button><button class="btn btn-primary" id="dnext">Siguiente tarjeta</button>`; }
  else if (D.state === 'end') { const k = D.pts[0] > D.pts[1] ? 0 : 1; msg.innerHTML = `<span class="dwin" style="--c:${k ? '#1F5FAD' : '#C0392B'}">¡Gana ${dname(k)}!</span>`; a.innerHTML = `<button class="btn btn-primary" id="dagain">Otro duelo</button>`; }
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on('dsay', () => speak(w.h));
  on('dshow', () => { D.state = 'shown'; speak(w.h); dRender(); });
  on('dok', () => {
    D.pts[D.who]++; document.getElementById('dp' + D.who).textContent = D.pts[D.who];
    D.state = D.pts[D.who] >= target ? 'end' : 'shown'; if (D.state === 'shown') { msg.textContent = `+1 para ${dname(D.who)}`; }
    speak(w.h); dRender(); if (D.state === 'shown') document.getElementById('dmsg').textContent = `+1 para ${dname(D.who)}`;
  });
  on('dno', () => { D.locked[D.who] = true; D.who = -1; if (D.locked[0] && D.locked[1]) { D.state = 'shown'; speak(w.h); } else D.state = 'ask'; dRender(); });
  on('dnext', dNext);
  on('dagain', dReset);
}
function buzz(k) {
  if (!document.body.classList.contains('duel') || D.state !== 'ask' || D.locked[k]) return;
  D.who = k; D.state = 'answer'; dRender();
}
[0, 1].forEach(k => document.getElementById('bz' + k).addEventListener('pointerdown', e => { e.preventDefault(); buzz(k); }));
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('duel') || e.target.tagName === 'INPUT') return;
  if (e.key === 'a' || e.key === 'A') buzz(0);
  if (e.key === 'l' || e.key === 'L') buzz(1);
});
document.getElementById('dreset').onclick = dReset;
document.getElementById('dtarget').onchange = () => { if (D.cur) dRender(); };
document.getElementById('duelbtn').onclick = e => {
  const on = !document.body.classList.contains('duel'); document.body.classList.toggle('duel', on);
  e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? 'Volver a las tarjetas' : 'Modo duelo';
  if (on) dReset(); else render();
};
</script>
